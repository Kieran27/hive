[workspace]
resolver = "2"
members = ["crates/hive", "crates/hive-core", "crates/hive-daemon", "crates/hive-tui"]

# Vendored vt100 0.16.2 carrying Nebula's DECSTBM scrollback patch (MIT, see
# vendor/vt100/Cargo.toml). Without it codex's inline viewport leaves no
# scrollback to scroll through.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hive-core = { path = "crates/hive-core" }
hive-daemon = { path = "crates/hive-daemon" }
hive-tui = { path = "crates/hive-tui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros", "io-util", "fs"] }
ulid = "1"
globset = "0.4"
directories = "6"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.16"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "all-widgets", "layout-cache", "macros", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
tui-term = "0.3"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Terminal emulation (vt100, tui-term, ratatui) is the hot path; keep deps
# optimised even in dev builds so replays and redraws stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
